_:
  pretty_name: 'BRIGHT'
  desc: '
<p>
BRIGHT (Benchmark for Reasoning-Intensive Generative Retrieval Tasks) is a realistic and
challenging benchmark for reasoning-intensive retrieval. It contains 1,398 real-world queries
collected from 12 diverse domains (biology, earth science, economics, psychology, robotics,
software engineering, mathematics, etc.), sourced from naturally occurring or carefully curated
human data.
</p>
<p>
Queries are long StackExchange posts, math Olympiad questions, or programming problems, and
documents are web pages, research articles, or similar resources. Retrieval requires deliberate
reasoning to identify relevant documents.
</p>
<ul>
<li><a href="https://brightbenchmark.github.io/">Dataset website</a></li>
<li><a href="https://huggingface.co/datasets/xlangai/BRIGHT">HuggingFace</a></li>
<li><a href="https://arxiv.org/abs/2407.12883">Paper</a></li>
</ul>
'
  bibtex_ids: ['Su2025Bright']

biology:
  desc: '
<p>
BRIGHT biology subset. Queries are StackExchange Biology posts; documents are web pages linked
in the accepted answers.
</p>
'
  bibtex_ids: ['Su2025Bright']

biology/long_documents:
  desc: '
<p>
BRIGHT biology subset with long-document retrieval. Queries are shared with
<a class="ds-ref">bright/biology</a>; documents are full web pages (as opposed to passages).
</p>
'
  bibtex_ids: ['Su2025Bright']

